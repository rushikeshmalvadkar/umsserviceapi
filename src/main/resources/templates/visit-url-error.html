<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Link Error</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 90vh;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 420px;
        }

        h2 {
            color: #e74c3c;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 14px;
        }

        .slug {
            margin-top: 10px;
            font-size: 13px;
            color: #888;
            word-break: break-all;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #2980b9;
        }
    </style>
</head>

<body>

<div class="card">

    <h2 th:text="${message}">Something went wrong</h2>

    <p>Please check the link or try again later.</p>

    <div class="slug">
        <strong>Slug:</strong>
        <span th:text="${slug}">N/A</span>
    </div>
</div>

</body>
</html>
